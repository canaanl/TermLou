<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TermLou</title>
<link rel="stylesheet" href="/static/xterm.css">
<style>
html,body{height:100%}
body{background:#1e1e1e;color:#e0e0e0;font-family:monospace;margin:0;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none}
#bar{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;align-items:center;flex:none}
button{background:#2d7d46;color:#fff;border:0;border-radius:6px;padding:6px 12px}
button:disabled{opacity:.4}
#main{flex:1;display:flex;flex-direction:column;min-height:0}
#pTerm{flex:1;display:flex;flex-direction:column;min-height:0}
#term{flex:1;min-height:200px;background:#000;border-radius:8px;padding:6px;touch-action:none}
#term,#term *{touch-action:none !important}
#term .xterm{height:100%}
#pFiles{overflow-y:auto}
#files{max-height:55dvh;overflow-y:auto}
#login{max-width:320px;margin:10vh auto;text-align:center}
#login input{width:100%;margin:6px 0;padding:8px;box-sizing:border-box;background:#111;color:#fff;border:1px solid #333;border-radius:6px}
#files a{color:#4dd0e1}
.tab{margin-top:8px}
</style>
</head>
<body>
<div id="login">
<h3>TermLou</h3>
<input id="user" autocomplete="username">
<input id="pass" type="password" autocomplete="current-password">
<button id="conn"></button>
<div id="lerr" style="color:#f66"></div>
</div>
<div id="main" style="display:none">
<div id="bar">
<button id="bTerm"></button>
<button id="bFiles"></button>
<span id="st"></span>
</div>
<div id="pTerm" class="tab">
<div id="term"></div>
</div>
<div id="pFiles" class="tab" style="display:none">
<div id="path">/</div>
<div id="files"></div>
<div style="margin-top:8px">
<input type="file" id="up" multiple>
<button id="upBtn"></button>
</div>
</div>
</div>
<script src="/static/xterm.js"></script>
<script src="/static/addon-fit.js"></script>
<script>
var LANG=/*{{LANG}}*/{"userPh":"","passPh":"","conn":"","errConn":"","errAuth":"","tabTerm":"","tabFiles":"","stIdle":"","stOn":"","stOff":"","upBtn":"","dl":""};
let token="",ws=null,term=null,fit=null,curPath="/";
const $=id=>document.getElementById(id);
$("user").placeholder=LANG.userPh;
$("pass").placeholder=LANG.passPh;
$("conn").textContent=LANG.conn;
$("bTerm").textContent=LANG.tabTerm;
$("bFiles").textContent=LANG.tabFiles;
$("upBtn").textContent=LANG.upBtn;
$("st").textContent=LANG.stIdle;
$("conn").onclick=async()=>{
  const u=$("user").value,p=$("pass").value;
  let r;
  try{
    r=await fetch("/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u,pass:p})});
  }catch(e){$("lerr").textContent=LANG.errConn;return;}
  if(r.status!==200){$("lerr").textContent=LANG.errAuth;return;}
  token=(await r.json()).token;
  $("login").style.display="none";$("main").style.display="flex";
  term=new Terminal({fontSize:14,scrollback:1000,cursorBlink:true});
  fit=new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open($("term"));
  fit.fit();
  const proto=location.protocol==="https:"?"wss":"ws";
  ws=new WebSocket(proto+"://"+location.host+"?token="+encodeURIComponent(token));
  ws.binaryType="arraybuffer";
  ws.onopen=()=>{
    $("st").textContent=LANG.stOn;
    term.focus();
    sendResize();
  };
  ws.onmessage=e=>{
    if(typeof e.data==="string")term.write(e.data);
    else term.write(new Uint8Array(e.data));
  };
  ws.onclose=()=>{$("st").textContent=LANG.stOff;};
  term.onData(d=>{
    if(ws&&ws.readyState===1)ws.send(new TextEncoder().encode(d));
  });
  term.onResize(s=>{
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"resize",cols:s.cols,rows:s.rows}));
  });
  loadFiles("/");
  setTimeout(()=>{fit.fit();sendResize();},300);
};
function sendResize(){
  try{
    fit.fit();
    if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:"resize",cols:term.cols,rows:term.rows}));
  }catch(e){}
}
$("bTerm").onclick=()=>{$("pTerm").style.display="flex";$("pFiles").style.display="none";fit.fit();sendResize();};
$("bFiles").onclick=()=>{$("pFiles").style.display="block";$("pTerm").style.display="none";};
function rowH(){
  try{
    const el=document.querySelector("#term");
    if(el&&term&&term.rows>0)return Math.max(8,el.clientHeight/term.rows);
  }catch(e){}
  return 17;
}
function scrollByPx(dy){
  if(!term)return;
  const lines=Math.trunc(dy/rowH());
  if(lines!==0)term.scrollLines(-lines);
}
(function(){
  const box=$("term");
  let sy=0,sx=0,st=0,mode=0;
  function reset(){mode=0;}
  box.addEventListener("touchstart",e=>{
    if(e.touches.length!==1){mode=2;return;}
    const t=e.touches[0];
    sy=t.clientY;sx=t.clientX;st=Date.now();mode=0;
  },{passive:true});
  box.addEventListener("touchmove",e=>{
    if(e.touches.length!==1||!term||mode===2)return;
    const t=e.touches[0];
    const dy=t.clientY-sy,dx=t.clientX-sx;
    if(!mode&&Math.abs(dy)<10&&Math.abs(dx)<10)return;
    if(!mode){try{const b=term.buffer.active;console.log("[lan] scroll start buf="+b.length+" base="+b.baseY);}catch(e){}}
    mode=1;
    scrollByPx(dy);
    sy=t.clientY;sx=t.clientX;
    if(e.cancelable)e.preventDefault();
  },{passive:false});
  box.addEventListener("touchend",()=>{
    if(mode===0&&term&&Date.now()-st<400)term.focus();
    reset();
  },{passive:true});
  box.addEventListener("touchcancel",reset,{passive:true});
})();
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
async function loadFiles(p){
  curPath=p;
  const r=await fetch("/files?path="+encodeURIComponent(p)+"&token="+encodeURIComponent(token));
  if(r.status!==200)return;
  const j=await r.json();
  $("path").textContent=j.path;
  let h="";
  if(j.path!=="/"&&j.path!=="")h+='<div><a href="#" data-p="..">..</a></div>';
  (j.files||[]).forEach(f=>{
    if(f.dir)h+='<div>📁 <a href="#" data-p="'+esc(f.name)+'">'+esc(f.name)+'</a></div>';
    else h+='<div>📄 '+esc(f.name)+' ('+f.size+') <a href="/download?path='+encodeURIComponent((j.path==="/"?"":j.path)+"/"+f.name)+'&token='+encodeURIComponent(token)+'">'+esc(LANG.dl)+'</a></div>';
  });
  $("files").innerHTML=h;
  document.querySelectorAll("#files a[data-p]").forEach(a=>{a.onclick=ev=>{
    ev.preventDefault();
    const n=a.getAttribute("data-p");
    loadFiles(n===".."?(curPath.split("/").slice(0,-1).join("/")||"/"):(curPath==="/"?"":"/"+curPath.replace(/^\//,""))+"/"+n);
  };});
}
$("upBtn").onclick=async()=>{
  const fs=$("up").files;
  for(const f of fs){
    const fd=new FormData();
    fd.append("file",f,f.name);
    await fetch("/upload?path="+encodeURIComponent(curPath)+"&token="+encodeURIComponent(token),{method:"POST",body:fd});
  }
  loadFiles(curPath);
};
window.onresize=sendResize;
window.onorientationchange=()=>{setTimeout(sendResize,300);};
</script>
</body>
</html>
