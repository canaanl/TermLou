name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Check no hardcoded Chinese in code
        run: |
          hits=$(grep -rP --include='*.kt' '"[^"]*[\x{4e00}-\x{9fff}]' app/src/main/java workspace/src/main/java 2>/dev/null | grep -v '// i18n-allow' || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "hardcoded Chinese UI strings found; move them to strings.xml"; exit 1; fi

      - name: Run lint
        continue-on-error: true
        run: gradle lintDebug --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest

      - name: Build with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
