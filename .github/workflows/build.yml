name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_HOME: ""
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle.kts', 'gradle/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug gradle env
        run: |
          echo "GRADLE_OPTS=${GRADLE_OPTS:-empty}"
          echo "JAVA_OPTS=${JAVA_OPTS:-empty}"
          echo "CLASSPATH=${CLASSPATH:-empty}"
          echo "GRADLE_HOME=${GRADLE_HOME:-empty}"
          echo "JAVA_TOOL_OPTIONS=${JAVA_TOOL_OPTIONS:-empty}"
          env | grep -i -E "gradle|classpath|java_tool" || echo "no match"
          ls -la ~/.gradle/ 2>&1 || true
          cat ~/.gradle/gradle.properties 2>&1 || echo "no user props"
          cat ~/.gradle/init.gradle 2>&1 || echo "no init.gradle"
          ls -la ~/.gradle/init.d/ 2>&1 || echo "no init.d"
          echo "=== app build head ==="; head -n 20 app/build.gradle.kts
          echo "=== workspace build head ==="; head -n 20 workspace/build.gradle.kts
          ls -lh app/lint-baseline.xml 2>&1 || echo "no baseline"
          ./gradlew help --stacktrace || true
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
