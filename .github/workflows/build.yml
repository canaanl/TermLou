name: Build APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('*.gradle.kts', 'gradle/*.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Debug wrapper
        run: |
          echo "=== wrapper manifest ==="; unzip -p gradle/wrapper/gradle-wrapper.jar META-INF/MANIFEST.MF 2>&1 | cat || true
          echo "=== gradle props ==="; cat gradle.properties; echo "---"; cat ~/.gradle/gradle.properties 2>&1 || echo "no user props"
          echo "=== find props ==="; find . ~ -name "*.properties" -exec echo "--- {} ---" \; -exec head -n 20 {} \; 2>&1 | head -n 80 || true
          echo "=== help debug ==="; ./gradlew help --debug --stacktrace 2>&1 | head -n 200 || true

      - name: Run lint
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
